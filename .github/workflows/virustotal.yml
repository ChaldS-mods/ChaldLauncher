name: VirusTotal

# Ручной запуск: проверяет файлы уже вышедшего релиза на VirusTotal и обновляет сайт.
# Actions -> VirusTotal -> Run workflow -> введи тег (например v0.2.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check secret
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "::error::Секрет VT_API_KEY не задан"; exit 1; fi
      - name: Resolve release tag
        run: |
          T="$(printf '%s' "$TAG" | tr -d '[:space:]')"
          case "$T" in [0-9]*) T="v$T";; esac
          echo "Ищу релиз: [$T]"
          if ! gh release view "$T" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Релиз [$T] не найден. Существующие релизы:"
            gh release list --repo "${{ github.repository }}" --limit 20 --json tagName,isDraft --jq '.[] | "\(.tagName) draft=\(.isDraft)"'
            exit 1
          fi
          echo "TAG=$T" >> "$GITHUB_ENV"
      - name: Scan release files on VirusTotal
        run: |
          mkdir vt-files
          gh release download "$TAG" --repo "${{ github.repository }}" --dir vt-files \
            --pattern '*.exe' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.tar.gz'
          python3 .github/scripts/virustotal.py vt.json vt-files/*
      - name: Update site data
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,publishedAt,url,assets,body > release.json
          gh api "repos/${{ github.repository }}/releases?per_page=100" > all.json
          python3 .github/scripts/update-site.py release.json docs/index.html all.json vt.json
          rm -rf release.json all.json vt.json vt-files
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "site: virustotal $TAG"
            git pull --rebase
            git push
          fi
